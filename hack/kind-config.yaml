# hack/kind-config.yaml
#
# kind-dev's own cluster config, used by `kind create cluster --name dev --config
# hack/kind-config.yaml`. This file didn't previously exist in this repo (kind-dev was
# created before it was written down) - added 2026-08-23 alongside kind-prod's copy so
# a future recreate is reproducible instead of guessed from memory.
#
# disableDefaultCNI: true + Calico (installed as a separate step right after cluster
# creation, before anything else touches the cluster) replace kind's default kindnet,
# which silently ignores every NetworkPolicy in this repo - see
# 01-argocd-platform/README.md's "kindnet -> Calico" section for the full story.
#
# podSubnet deliberately identical to every other cluster in this fleet (kind-prod,
# platform-cicd's own kind-observe/kind-dev-style clusters) - each cluster's pod CIDR
# only ever routes inside that cluster, so reusing the same range across clusters on
# the shared podman "kind" bridge network causes no conflict.
#
# extraPortMappings forwards host 80/443 to the envoy Service's fixed NodePorts (see
# 10-crds-operators/contour/kustomization.yaml, which patches envoy from LoadBalancer
# to NodePort 30080/30443 - no LoadBalancer implementation exists on kind, so the
# plain LoadBalancer Service sat <pending> forever with no host-reachable ingress path
# at all, confirmed live 2026-08-23). These mappings are baked into the node
# container at `kind create cluster` time and can't be added to a running cluster -
# this file only takes effect the next time kind-dev is actually recreated.
#
# Single control-plane node, no workers - matches this cluster's actual topology
# (kind-dev has only ever run `dev-control-plane`), not platform-cicd's own 3-node
# template.
#
# kubeadmConfigPatches (KubeletConfiguration maxPods) - kubelet's stock default (110)
# sits well below what this cluster's full stack actually schedules (100 pods measured
# live 2026-08-23, ArgoCD x2 + Crossplane + cert-manager + external-secrets + the full
# observability stack + Tekton + platform-cicd + Infisical + tenants, all on one node) -
# baked in here so a fresh `kind create cluster` doesn't have to be live-patched
# (`/var/lib/kubelet/config.yaml` + `systemctl restart kubelet`) after the fact, same
# gap already hit and fixed live once before (2026-08-16, see
# 50-platform-cicd/tekton-operator/README.md's own "node-capacity" note) and again
# 2026-08-23 recreating from scratch, since the live patch doesn't survive a recreate.
#
# The companion fix from both of those passes - raising podman's per-container
# --pids-limit (default 2048, also hit live both times, identical generic
# `fork/exec: resource temporarily unavailable` symptom) - is NOT set here: it's a
# podman/container-runtime setting, not a kubelet one, so as of 2026-08-23 it's set
# globally via `~/.config/containers/containers.conf`'s own `pids_limit = 8192`
# instead, which covers every podman container (not just kind nodes) and, unlike a
# per-container `podman update`, actually persists across a `kind create cluster`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
