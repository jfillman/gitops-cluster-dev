# Same minimum scope as kind-man's own backstage-ingestor RBAC (view + CRD read +
# crossplane-browse, no crossplane-view/managed-resource or secrets access) - see that
# file's own header for the full rationale (TeraSky-OSS/backstage-plugins
# kubernetes-ingestor/K8S_RBAC.md). The one real difference: this ServiceAccount's
# token is minted as a long-lived Secret (below), not a kubelet-projected in-cluster
# mount, because the consumer (Backstage) runs on a different cluster (kind-man) and
# has no pod here to project a token into. The token value itself is never read or
# handled by an assistant - see this directory's README for how it's planted into
# Infisical and delivered to kind-man.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-ingestor
  namespace: backstage-system
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-ingestor-token
  namespace: backstage-system
  annotations:
    kubernetes.io/service-account.name: backstage-ingestor
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-crd-viewer
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crd-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-crd-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crossplane-browse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-browse
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Argo Rollouts visualization (2026-09-04, redhat-argocd plugin's Rollouts
# feature - app-config.yaml's kubernetes.customResources in the backstage repo).
# Explicit grant, not assumed covered by the `view` ClusterRole above -
# argoproj.io's Rollout/AnalysisRun CRDs aren't part of Kubernetes' own
# aggregation labels `view` matches by default, same reasoning as the dedicated
# CRD-viewer and crossplane-browse grants above rather than assuming `view`
# is broader than it is.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-argo-rollouts-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-argo-rollouts-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-argo-rollouts-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Gateway API (2026-09-06, Glidepath's Config-tab route URL - app-config.yaml's
# kubernetes.customResources in the backstage repo). Same reasoning as the Argo
# Rollouts grant above: gateway.networking.k8s.io's HTTPRoute/Gateway CRDs
# aren't part of `view`'s aggregation either. Gateway is included alongside
# HTTPRoute because HTTPRoute carries no TLS info of its own - the actual
# http-vs-https scheme is only knowable from the Gateway listener a route's
# parentRefs point at.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-gateway-api-viewer
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-gateway-api-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-gateway-api-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Rekor public-key read (2026-09-06, Glidepath's Supply Chain panel - real SET/
# transparency-log verification now that Rekor is deployed for real, see
# platform-cicd's provenance-policy.md). Deliberately namespaced Role/RoleBinding,
# not a ClusterRole like every other grant in this file - rekor-server is itself a
# namespaced Service, and there's exactly one instance of it, so a cluster-wide grant
# would be broader than what's actually being reached. `services/proxy` (not plain
# `services`, which `view` already covers) is what lets a caller with no direct
# network route to the Service reach its HTTP API through the API server itself - the
# same mechanism the ConfigMap-based Fulcio root-cert fetch uses for a different
# resource kind. No ConfigMap equivalent exists for Rekor's public key on purpose
# (platform-cicd deliberately deleted rekor-pubkey-sync-job.yaml after it went stale -
# see that repo's own history - every real consumer fetches it live at verify-time
# instead, and Glidepath now does the same).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-ingestor-rekor-proxy
  namespace: rekor-system
rules:
  # resourceNames must match the exact "name" or "name:port" string used in
  # the proxy URL path - confirmed live (2026-09-06) that a request to
  # .../services/rekor-server:80/proxy/... is checked against the literal
  # resourceName "rekor-server:80", not "rekor-server" alone. Both forms
  # listed since either could reasonably be used by a caller.
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["rekor-server", "rekor-server:80"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-ingestor-rekor-proxy
  namespace: rekor-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-ingestor-rekor-proxy
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
