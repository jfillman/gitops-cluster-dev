# Same minimum scope as kind-man's own backstage-ingestor RBAC (view + CRD read +
# crossplane-browse, no crossplane-view/managed-resource or secrets access) - see that
# file's own header for the full rationale (TeraSky-OSS/backstage-plugins
# kubernetes-ingestor/K8S_RBAC.md). The one real difference: this ServiceAccount's
# token is minted as a long-lived Secret (below), not a kubelet-projected in-cluster
# mount, because the consumer (Backstage) runs on a different cluster (kind-man) and
# has no pod here to project a token into. The token value itself is never read or
# handled by an assistant - see this directory's README for how it's planted into
# Infisical and delivered to kind-man.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-ingestor
  namespace: backstage-system
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-ingestor-token
  namespace: backstage-system
  annotations:
    kubernetes.io/service-account.name: backstage-ingestor
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-crd-viewer
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crd-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-crd-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crossplane-browse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-browse
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Argo Rollouts visualization (2026-09-04, redhat-argocd plugin's Rollouts
# feature - app-config.yaml's kubernetes.customResources in the backstage repo).
# Explicit grant, not assumed covered by the `view` ClusterRole above -
# argoproj.io's Rollout/AnalysisRun CRDs aren't part of Kubernetes' own
# aggregation labels `view` matches by default, same reasoning as the dedicated
# CRD-viewer and crossplane-browse grants above rather than assuming `view`
# is broader than it is.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-argo-rollouts-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-argo-rollouts-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-argo-rollouts-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Gateway API (2026-09-06, Glidepath's Config-tab route URL - app-config.yaml's
# kubernetes.customResources in the backstage repo). Same reasoning as the Argo
# Rollouts grant above: gateway.networking.k8s.io's HTTPRoute/Gateway CRDs
# aren't part of `view`'s aggregation either. Gateway is included alongside
# HTTPRoute because HTTPRoute carries no TLS info of its own - the actual
# http-vs-https scheme is only knowable from the Gateway listener a route's
# parentRefs point at.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-gateway-api-viewer
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-gateway-api-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-gateway-api-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Rekor public-key read (2026-09-06, Glidepath's Supply Chain panel - real SET/
# transparency-log verification now that Rekor is deployed for real, see
# platform-cicd's provenance-policy.md). Deliberately namespaced Role/RoleBinding,
# not a ClusterRole like every other grant in this file - rekor-server is itself a
# namespaced Service, and there's exactly one instance of it, so a cluster-wide grant
# would be broader than what's actually being reached. `services/proxy` (not plain
# `services`, which `view` already covers) is what lets a caller with no direct
# network route to the Service reach its HTTP API through the API server itself - the
# same mechanism the ConfigMap-based Fulcio root-cert fetch uses for a different
# resource kind. No ConfigMap equivalent exists for Rekor's public key on purpose
# (platform-cicd deliberately deleted rekor-pubkey-sync-job.yaml after it went stale -
# see that repo's own history - every real consumer fetches it live at verify-time
# instead, and Glidepath now does the same).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-ingestor-rekor-proxy
  namespace: rekor-system
rules:
  # resourceNames must match the exact "name" or "name:port" string used in
  # the proxy URL path - confirmed live (2026-09-06) that a request to
  # .../services/rekor-server:80/proxy/... is checked against the literal
  # resourceName "rekor-server:80", not "rekor-server" alone. Both forms
  # listed since either could reasonably be used by a caller.
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["rekor-server", "rekor-server:80"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-ingestor-rekor-proxy
  namespace: rekor-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-ingestor-rekor-proxy
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Tower's Tekton "Re-run" + "Cancel" actions (2026-09-14/15,
# HANDOFF-tower-write-actions.md Tier 1 - the write-action security
# framework that handoff establishes: a "delegated action" whose blast
# radius is scoped by RESOURCE KIND, not a broad standing grant). This is
# the one deliberate exception to this file's otherwise read-only posture
# (README.md) - `create` + `patch` on PipelineRuns only, nothing else: no
# get/list/watch here because Tower already reads PipelineRuns/TaskRuns
# through the ordinary Kubernetes proxy's ClusterRole `view` binding above,
# and no delete because neither action needs it - re-running submits a
# brand-new PipelineRun (a clone of the failed one, fresh generateName)
# rather than mutating the original, and cancelling is itself a `patch`
# (spec.status -> CancelledRunFinally), never a removal.
#
# Note on `patch`'s real scope: Kubernetes RBAC has no field-level
# granularity - this verb technically lets the identity PATCH any field of
# any PipelineRun, not just spec.status, the same way `create` above
# technically allows any PipelineRun spec, not just a faithful re-run clone.
# What's actually sent is constrained by this repo's own frontend/backend
# code (useCancelPipelineRun.ts sends only a spec.status merge-patch), not
# by RBAC itself - narrowing further would need a validating webhook, which
# doesn't exist here. Same honest-scope posture as every other grant in
# this file.
#
# Cluster-scoped (not namespaced to one app's app-<name>-cicd) for the same
# reason backstage-argo-rollouts-viewer above is cluster-scoped: onboarded
# apps each get their own -cicd namespace and this identity has no way to
# know the full set up front, same as every other resource-kind grant here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Name predates Cancel (2026-09-14, re-run only) - kept as-is rather than
  # renamed to `...-actions` so this stays the same object ArgoCD already
  # manages instead of orphaning it (this Application's syncPolicy has no
  # `prune: true`, so a rename here wouldn't clean up the old name on its
  # own). The rules below are what actually govern scope, not the name.
  name: backstage-tekton-rerun
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-tekton-rerun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-tekton-rerun
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Tower's Topology tab "all resources" gallery (2026-09-17) - RBAC objects
# (Roles/RoleBindings/ClusterRoles/ClusterRoleBindings) are deliberately
# excluded from the `view` ClusterRole's own aggregation (Kubernetes never
# lets `view`/`edit` see who-can-do-what by default, for the same reason it
# excludes Secret data), so a dedicated grant is the only way to surface
# them, same reasoning as every other CRD-shaped exception in this file.
# ClusterRole/ClusterRoleBinding added alongside the namespaced pair
# (2026-09-17, same day) once the gallery's RBAC view started resolving a
# RoleBinding's roleRef to its actual rules - that reference is very
# commonly a ClusterRole (bound just within one namespace via a
# RoleBinding), so resolving it needs read access to ClusterRoles too, not
# just Roles. Read-only, no different in spirit from the `view` binding
# this identity already has for every other resource kind - this only adds
# visibility into RBAC *configuration* (which subjects a binding names,
# which rules a Role/ClusterRole grants), never lets this identity exercise
# those grants itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-rbac-viewer
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-rbac-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-rbac-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Same Topology-tab resource gallery, the two CRD kinds it also wants:
# ExternalSecret (external-secrets.io - this platform's Infisical-backed
# secret sync, see infisical-secretstore-operator) and ServiceMonitor
# (monitoring.coreos.com - what wires an app's metrics into
# kube-prometheus-stack). Neither group is covered by `view` or any
# existing grant here, same reasoning as backstage-argo-rollouts-viewer/
# backstage-gateway-api-viewer above - grouped into one ClusterRole since
# both were added for the same feature, rather than two more separate
# ClusterRole/ClusterRoleBinding pairs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-topology-resource-viewer
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-topology-resource-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-topology-resource-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
