# Fully default install - `helm get values external-secrets -n external-secrets`
# returned null. This is the ESO controller only - ClusterSecretStore/ExternalSecret
# objects (and the future Infisical-backed SecretStore XRD, service-catalog-design.md
# item 8) are per-app, not cluster config, and don't belong here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.8.0
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
