# Crossplane Provider packages. Rendered as plain manifests (not a Helm chart) via
# the crossplane-packages Application's directory source — see
# packages-application.yaml. Pinned to the exact package references already installed
# (`kubectl get providers.pkg.crossplane.io`).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: crds-operators
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v1.2.1
---
# Backs NodeJSApplication (idp-service-catalog, the first Bootstrap-tier XRD —
# idp/docs/service-catalog-design.md §1) — every "create/commit to a repo" step in that
# XRD's Composition is a repo.github.upbound.io managed resource from this provider.
# Confirmed live against the provider's own source (github.com/crossplane-contrib/
# provider-upjet-github) rather than guessed: the actual xpkg package name is
# provider-upjet-github, not provider-github (the design doc's shorthand) — the
# examples/namespaced/ tree in that repo is unfinished upjet-template scaffolding
# (literally apiVersion: template.m.crossplane.io/v1beta1, never filled in), so this
# provider's real, working resources are the Cluster-scoped ones under examples/cluster/
# — that's what provider-github-config.yaml (this same directory) and
# idp-service-catalog's Composition target.
#
# KNOWN ROOT CAUSE, NOT YET FIXABLE BY VERSION BUMP (2026-09-04): v0.19.1's vendored
# terraform-provider-github (v6.6.0, Feb 2025) has a real bug in github_repository_file's
# Read() - it only special-cases HTTP 429 for rate limiting, but GitHub's actual
# primary rate-limit response is 403 ("API rate limit of N still exceeded"), confirmed
# live from this exact provider's own logs. A 403 falls through Read()'s error
# handling straight to "resource no longer exists, remove from state", which
# Crossplane surfaces as Observe() reporting ResourceExists:false - triggering a
# fresh Create with overwriteOnCreate:true and silently wiping the file's real
# content back to the Composition's bootstrap template. This actually happened live:
# gitops-checkout-api and gitops-order-api's kind-prod values.yaml (real
# rollout/releaseTracking data) got clobbered this way multiple times today and once
# on 2026-09-02, restored by hand each time (see those repos' own git history). The
# fix exists upstream (terraform-provider-github's Feb 2026 refactor that only
# removes state on an actual 404) and IS in provider-upjet-github's v0.20.0 go.mod
# (confirmed via `gh api .../compare` against the fixing commit) - but v0.20.0 was
# NEVER PUBLISHED to xpkg.upbound.io, the actual registry this Provider installs
# from (confirmed: Crossplane's own package manager gets a real 404/MANIFEST_UNKNOWN
# resolving it, and marketplace.upbound.io itself lists v0.19.1 as the latest
# published release - the v0.20.0 git tag exists, but no corresponding OCI package
# was ever pushed). Tried bumping to v0.20.0 live - Crossplane correctly refused to
# touch the working install rather than break it, no harm done, reverted here.
# Actually deploying this fix needs a custom-built image (clone provider-upjet-github
# at v0.20.0, build, push to our own registry - same pattern as idp-service-catalog's
# own operators under ghcr.io/jfillman/) - real follow-up work, not a quick pin bump.
# Mitigated for now instead: the only resource type this bug can actually destroy
# (values.yaml, the one file with continuously-live real content - everything else
# this provider manages is idempotent bootstrap/platform content, safe to
# re-overwrite) has its 3 affected RepositoryFile MRs paused
# (crossplane.io/paused) directly in-cluster - see checkout-api-kind-prod-{prod,
# staging}-values-yaml and order-api-kind-prod-prod-values-yaml in app-checkout-api-cicd/
# app-order-api-cicd.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-github
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: crds-operators
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-upjet-github:v0.19.1
