# DeploymentRuntimeConfig for provider-infisical, referenced by provider-infisical's
# runtimeConfigRef in providers.yaml (this directory).
#
# Own dedicated runtime config, never the shared "default" one - a
# DeploymentRuntimeConfig named "default" is the fallback for every package that
# doesn't specify its own runtimeConfigRef, Providers and Composition Functions
# alike; editing a shared one has previously crash-looped every Function
# cluster-wide from a single flag meant for one provider (a real incident, see
# feedback_crossplane_provider_live_ops.md). No custom --poll/--max-reconcile-rate
# args here (unlike provider-github-runtime.yaml's own, which exists to fix a real,
# externally-imposed GitHub rate limit, root-caused live) - this provider talks to a
# self-hosted in-cluster Infisical instance with no comparable external limit, so the
# binary's own defaults apply. Revisit if a real reconcile-load problem shows up.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-infisical-runtime
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: crds-operators
spec:
  deploymentTemplate:
    spec:
      selector:
        matchLabels:
          pkg.crossplane.io/provider: provider-infisical
      template:
        spec: {}
