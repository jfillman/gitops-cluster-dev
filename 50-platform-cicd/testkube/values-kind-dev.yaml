# Which onboarded tenants' <type>-<appName>-cicd namespaces Testkube is allowed to run
# TestWorkflows in, on kind-dev. Hand-maintained as part of the same reviewed PR that
# adds tenants/<app-name>/identity.yaml in gitops-cluster-dev-tenants (see platform-cicd's
# docs/admin/onboarding-mechanics.md step 3) - not automated, because Testkube enforces
# this list as a hard runtime allow-list in code with no wildcard option (see
# application.yaml's header), and onboarding a tenant already requires a reviewed PR
# anyway, so this is one more field in an existing motion, not a new category of toil.
#
# generateAPIServerRBAC/generateTestJobRBAC do NOT default to true when omitted -
# verified live via `helm template`: the chart's `{{- if $rangeItem.generateAPIServerRBAC }}`
# guards are falsy on a missing key, so leaving these out silently renders zero Role/
# RoleBinding objects for that namespace (Testkube would pass its own namespace allow-
# list check, then fail with a K8s RBAC 403 trying to actually create the Job). Both
# must be listed explicitly on every entry.
#
# jobServiceAccountName also has no default - the chart templates
# `metadata: name: {{ $rangeItem.jobServiceAccountName }}` verbatim on the
# ServiceAccount it creates for that namespace, so an omitted value renders a
# ServiceAccount with an empty metadata.name (rejected by the API server outright).
# Convention: tests-job-<namespace>, one per tenant, so it can never collide across
# tenants sharing this one Testkube installation.
testkube-api:
  additionalNamespaces:
    - app-checkout-api-cicd
    - app-nodejs-demo-app-cicd
  executionNamespaces:
    - namespace: app-checkout-api-cicd
      generateAPIServerRBAC: true
      generateTestJobRBAC: true
      jobServiceAccountName: tests-job-app-checkout-api-cicd
    - namespace: app-nodejs-demo-app-cicd
      generateAPIServerRBAC: true
      generateTestJobRBAC: true
      jobServiceAccountName: tests-job-app-nodejs-demo-app-cicd
