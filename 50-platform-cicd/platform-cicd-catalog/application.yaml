# Git HEAD source (not a version-pinned tag) - matches how
# tenant-onboarding-applicationset.yaml's own source 0 already tracks
# platformCicdRepoUrl at `main`.
#
# tektonChainsNamespace: tekton-pipelines - must match tekton-operator/tektonconfig.yaml's
# own spec.targetNamespace exactly, or verify-image-provenance.yaml/
# verify-sast-attestation.yaml's cosign identity-regexp check fails every real build (see
# tekton-operator/README.md). Set here AND in platform-cicd-control-plane/
# values-kind-dev.yaml - same value, two charts, kept in sync deliberately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cicd-catalog
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: platform-cicd
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/glidepath.git
    targetRevision: main
    path: charts/glidepath-catalog
    helm:
      releaseName: platform-cicd-catalog
      valuesObject:
        tektonChainsNamespace: tekton-pipelines
        # Backstage runs on kiac-prod, a different cluster from this one - not an
        # in-cluster Service DNS name. backstage.prod.kiac.local isn't real DNS either
        # (only resolves on a developer's own laptop via refresh-kiac-hosts.sh); reaching
        # it from a pod here also requires the hostAliases entry glidepath-app's own
        # backstageHostAliasIP value renders (see that value's own comment) - both must
        # point at the same current kiac-prod IP, kept in sync manually.
        backstageBaseUrl: http://backstage.prod.kiac.local:7007
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-catalog
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
