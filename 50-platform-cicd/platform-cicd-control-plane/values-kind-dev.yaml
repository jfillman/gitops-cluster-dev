# values-kind-dev.yaml
#
# kind-dev's per-cluster overrides for platform-cicd's platform-cicd-control-plane
# chart. Lives here (the cluster-config repo), not in platform-cicd.git's own hack/ -
# this is cluster STATE, not application source, and platform-cicd needs to stay
# installable on any cluster without carrying another cluster's secrets/identity in
# its own repo. See ../application.yaml's own header for the multi-source mechanism
# that wires this file in, and platform-cicd/hack/generate-cluster-values.sh for how
# it's produced (writes straight into this directory now, not platform-cicd/hack).
#
# fulcio.issuerCACert: kind-dev's own kube-root-ca.crt "ca.crt" content, read live
# 2026-08-15 (`kubectl --context kind-dev get configmap kube-root-ca.crt -n default -o
# jsonpath='{.data.ca\.crt}'`). NOT kind-observe's - confirmed live the two differ.
#
# fulcio.rootCert: the public half of a freshly, independently generated Fulcio root CA
# for kind-dev (openssl req -x509 -newkey ed25519, platform-cicd's docs/image-signing.md
# documented procedure) - deliberately not a copy of kind-observe's trust root. The
# matching private key + passphrase were used only to create the fulcio-secret and
# fulcio-server-config Secrets directly on kind-dev (kubectl create secret) and were
# never written to any repo or persisted anywhere else.
#
