# Pins idp-service-catalog's XRDs + Compositions - the cluster-installed-once
# raw-manifest layer - to a git tag. "git source, pinned to a tag" is the
# mechanism idp/docs/gitops-strategy.md §8 specifies for this repo, reusing
# the directory-source pattern already proven for
# 10-crds-operators/crossplane/packages-application.yaml (raw manifests, not
# a Helm chart) - just sourced from idp-service-catalog itself instead of
# this repo.
#
# Deliberately a narrow include glob rather than an exclude list (unlike
# packages-application.yaml's directory.exclude): idp-service-catalog's own
# compositions/<name>/ folders carry maintainer-only siblings alongside each
# generated composition.yaml - templates/*.yaml source fragments (not valid
# standalone manifests, they're Go-template text with unquoted `<<...>>`
# actions), example/ XR fixtures (one, xr-invalid.yaml, is deliberately
# invalid), and build-composition.sh. Listing exactly what's real avoids ever
# needing to extend an exclude list as future catalog items add their own
# non-manifest siblings the same way.
#
# charts/idp-application and functions/ are deliberately NOT included here:
# the chart isn't installed cluster-wide - Compositions render it per
# app-release into gitops-<app-name> repos, see idp-application/README.md -
# and Function packages are already registered by pinned OCI tag in
# 10-crds-operators/crossplane/functions.yaml, not by syncing functions/'s
# own source directories.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-service-catalog
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: service-catalog
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/airframe.git
    # 2026-08-19: bumped from v0.3.24, found live stuck there while chasing an
    # unrelated registry-credentials sync failure - checkout-api-dev's own
    # idp-application chart (pinned separately, in
    # 02-argocd-apps/tenant-appprojects/chart/templates/
    # lower-envs-applicationset.yaml, already at v0.3.35) renders a RolloutWatch
    # XR unconditionally whenever a release has a workload, but this
    # Application - the thing that actually installs the RolloutWatch XRD/
    # Composition - had never synced past v0.3.24, which predates that XRD's
    # addition (v0.3.27) entirely: `kubectl get crd rolloutwatches.catalog.
    # idp.io` returned NotFound on kind-dev. v0.3.24..v0.3.35's only xrds/
    # compositions/ diff is that one addition (checked via `git diff --stat`) -
    # a clean, additive-only bump, not a version chosen at random.
    # 2026-08-22: bumped from v0.3.35. Adds ApplicationEnvironment's new
    # spec.configMapGenerator field (xrds/applicationenvironment.yaml +
    # its Composition) - without it, tenants/<app>/<env>/identity.yaml's
    # continuous RepositoryFile reconciliation had no way to durably carry a
    # per-env opt-in into the tenant-onboarding ApplicationSet's optional 3rd
    # Kustomize source, silently reverting a manual edit that had set it.
    # v0.3.35..v0.3.36's only xrds/compositions/ diff is that one addition
    # (checked via `git diff --stat`) - clean, additive-only, same bar the
    # prior bump above used.
    # 2026-08-23: bumped from v0.3.36 to v0.3.38 (skipping v0.3.37 - its own
    # changes don't touch xrds/ or compositions/*/composition.yaml at all,
    # confirmed via `git log`/`git diff --stat` across the full v0.3.36..v0.3.38
    # range). v0.3.38 adds crossplane.io/external-name to NodeJSApplication's
    # src/gitops Repository managed resources - fixes a real live bug this
    # same kind-dev rebuild hit: a fresh Repository MR with no external-name
    # tries to Create a GitHub repo that already exists (GitHub, unlike
    # Crossplane state, survives the rebuild) and 422s forever. Diff is that
    # one addition, twice (checked via `git diff --stat`) - clean,
    # additive-only, same bar the prior bumps above used.
    # 2026-08-24: bumped from v0.3.38 to v0.3.39. Fixes the SecretStore
    # Composition's hardcoded Infisical NodePort IP - stale at 10.89.0.2 since
    # this same kind-dev rebuild moved the node's real podman-network address
    # to 10.89.0.5, breaking every cross-cluster SecretStore this Composition
    # renders (live-verified: `unable to create client` on kind-prod).
    # v0.3.38..v0.3.39's only xrds/compositions/ diff is that IP string, twice
    # (checked via `git diff --stat`) - clean, same bar the prior bumps above
    # used.
    # 2026-08-24: bumped from v0.3.39 to v0.3.41 (v0.3.40 is an unrelated
    # idp-application chart tag on this shared repo). The IP flipped back to
    # 10.89.0.2 after a further kind-dev restart - not monotonic, don't
    # assume a higher IP is newer. No live effect here either, same as the
    # v0.3.39 bump above.
    # 2026-08-24: bumped from v0.3.41 to v0.3.42. Adds SpringBootApplication -
    # a brand-new XRD (xrds/springbootapplication.yaml) + Composition
    # (compositions/springbootapplication/composition.yaml), Item 1/2's second
    # Bootstrap-tier stack, structurally a port of NodeJSApplication's already-
    # live mechanism onto Java/Spring Boot. v0.3.41..v0.3.42's only xrds/
    # compositions/ diff is this one addition (checked via `git diff --stat`) -
    # clean, additive-only, same bar the prior bumps above used. Already
    # live-verified pre-bump via direct `kubectl apply` on kind-dev (throwaway
    # springbootapp-verify-test, real GitHub repos/commits, torn down after) -
    # this bump is what makes it the durable, GitOps-managed source of truth
    # instead of an out-of-band kubectl apply.
    # 2026-08-24: bumped from v0.3.42 to v0.3.43. Excludes "Delete" from
    # cicd-identity-yaml's managementPolicies in both NodeJSApplication and
    # SpringBootApplication's Compositions - safety step ahead of extracting
    # CI/CD onboarding into its own TektonCICD XRD, so that removing this
    # composition-resource-name from the pipeline later orphans only the k8s
    # RepositoryFile CR, not the real tenants/<app>/identity.yaml file on
    # GitHub (matches applicationenvironment's own cluster-identity-yaml.yaml
    # precedent). v0.3.42..v0.3.43's only xrds/compositions/ diff is that one
    # field, twice (checked via `git diff --stat`) - clean, additive-only,
    # same bar the prior bumps above used.
    # 2026-08-25: bumped from v0.3.43 to v0.3.44. Extracts CI/CD onboarding out of
    # NodeJSApplication/SpringBootApplication's own Compositions into a new
    # TektonCICD XRD (xrds/tektoncicd.yaml + compositions/tektoncicd/) - both app
    # XRDs now compose a TektonCICD child directly instead of rendering the
    # devCluster-gate/identity.yaml-commit/status logic inline. Depends on v0.3.43's
    # managementPolicies fix already being live (already verified, all three
    # onboarded apps patched in place, no delete/recreate): this bump orphans the
    # old cicd-identity-yaml composition-resource-name on checkout-api,
    # nodejs-demo-app, and order-api, and because Delete is now excluded, that only
    # removes the k8s CR - the real tenants/<app>/identity.yaml file on GitHub
    # survives, and the new TektonCICD child's own RepositoryFile
    # (overwriteOnCreate: true, identical content) re-establishes ownership.
    # v0.3.43..v0.3.44's only xrds/compositions/ diff is this extraction (checked
    # via `git diff --stat`) - same bar the prior bumps above used.
    # 2026-08-25: bumped from v0.3.44 to v0.3.45. ApplicationEnvironment's own
    # app-usage.yaml no longer hardcodes kind: NodeJSApplication on the composed
    # Usage's spec.of - a real bug found live testing order-api's fresh
    # SpringBootApplication install (that Usage's `of` target never resolved,
    # which left the whole composite stuck at Ready: False forever, not the
    # "harmless no-op" the old code assumed). New 00-app-kind-gate.yaml resolves
    # the real owning kind via an ExtraResources lookup, same pattern as
    # 00-cluster-gate.yaml/00-devcluster-gate.yaml. Verified offline via
    # crossplane render before this bump (existing gate-pass fixture unchanged,
    # new springboot-app-exists.yaml fixture proves the new branch) - only
    # composition.yaml under applicationenvironment/ changed, same scoped bar as
    # the prior bumps above.
    # 2026-08-25: bumped from v0.3.45 to v0.3.46. Adds PythonApplication
    # (xrds/pythonapplication.yaml + compositions/pythonapplication/) and
    # GoApplication (xrds/goapplication.yaml + compositions/goapplication/) - third
    # and fourth Bootstrap-tier stacks, structural ports of NodeJSApplication built
    # after the TektonCICD extraction (both compose a TektonCICD child for CI/CD
    # onboarding instead of carrying it inline). v0.3.45..v0.3.46's only
    # xrds/compositions/ diff is these two brand-new additions (checked via
    # `git diff --stat`) - clean, additive-only, same bar the prior bumps above
    # used. Generated main.py/main.go/go.mod offline-verified against the real
    # Python/Go toolchains before this bump, not just crossplane render.
    # 2026-08-25: bumped from v0.3.46 to v0.3.47. ApplicationEnvironment's own
    # 00-app-kind-gate.yaml only checked NodeJSApplication/SpringBootApplication,
    # defaulting to NodeJSApplication otherwise - found live the moment
    # search-api-kind-prod-prod/process-api-kind-prod-prod were created (v0.3.46's
    # own new PythonApplication/GoApplication stacks): the composed Usage's
    # spec.of.kind resolved to NodeJSApplication for both, which doesn't exist for
    # either app, stuck at Ready: False the same way order-api's did before this
    # gate existed at all. Extends the same lookup mechanism with two more
    # ExtraResources requirements. v0.3.46..v0.3.47's only xrds/compositions/ diff
    # is this one gate file (checked via `git diff --stat`) - clean, same bar the
    # prior bumps above used.
    #
    # v0.3.47->v0.3.49 (2026-08-27, Backstage catalog ingestion): v0.3.48 added CI/
    # README for infisical-secretstore-operator (outside this sync glob, no-op here).
    # v0.3.49 annotates the 5 Bootstrap-tier XRDs with terasky.backstage.io/
    # add-to-catalog + target-path (idp/docs/backstage-design.md) - additive only,
    # checked via `git diff --stat v0.3.47 v0.3.49`.
    #
    # v0.3.50 (2026-08-29): adds TektonCICD/NodeJSApplication spec.extraGitopsRepos -
    # an app whose gitops-image-bump stage (platform-cicd) targets a repo it doesn't
    # own by the gitops-<appName> convention (e.g. Backstage -> gitops-cluster-
    # kind-man) needs an extra Repository CR grant. A hand-edit to the generated
    # tenants/backstage/identity.yaml got reverted by the TektonCICD Composition's
    # own reconcile loop - this makes the grant a real declared XR field instead, so
    # it's part of the desired state rather than drift. Additive only.
    # 2026-09-04: bumped from v0.3.50 to v0.3.53 to keep this pin from drifting too
    # far behind the repo's latest tag. v0.3.51..v0.3.53's changes (RolloutWatch
    # component-type annotation, idp-application's outcome-relay hostAliases) are
    # both outside this Application's include list (slo/secretstore/rolloutwatch
    # XRD+Composition only) - confirmed via `git diff v0.3.50 v0.3.53 --stat` on
    # those exact paths, no diff. No functional change to this Application's own
    # synced resources.
    # 2026-09-04: bumped v0.3.53 -> v0.3.54 - a real functional fix this time, unlike
    # the note above. v0.3.54 quotes every crossplane.io/external-name value in
    # applicationenvironment/goapplication/nodejsapplication/pythonapplication/
    # springbootapplication's composition.yaml (unquoted "<repo>:<file>:" scalars had
    # an invalid trailing bare colon, breaking YAML decode fleet-wide - every app XR on
    # this cluster was Synced: False from render-github-resources's fatal error).
    # This Application's include list IS the broad {xrds/*.yaml,compositions/*/
    # composition.yaml} wildcard (unlike kind-prod/kind-man's narrower copies), so
    # this bump is required here, not optional.
    # 2026-09-04: bumped v0.3.54 -> v0.3.55 - tektoncicd's own external-name had the
    # identical unquoted-trailing-colon YAML bug, missed in the v0.3.54 sweep because
    # its render step is named render-tektoncicd-resources, not render-github-resources
    # (a directory-scoped grep, not this Application's own include list, is what missed
    # it - this include list is the broad wildcard and was already covering it).
    # 2026-09-08: bumped v0.3.55 -> v0.3.59. Two real fixes in range (checked via
    # `git diff v0.3.55 v0.3.59 --stat` against this Application's own xrds/
    # compositions/*/composition.yaml scope):
    #   - Fixes stale Infisical hostAPI IP (10.89.0.2, dead podman-network address)
    #     in secretstore's Composition, replaced with the dev.kiac.local hostname
    #     already used elsewhere.
    #   - Drops "Update" from cluster-identity-yaml (applicationenvironment) and
    #     cicd-identity-yaml (tektoncicd)'s managementPolicies - these were the only
    #     two RepositoryFile resources in the whole catalog still keeping "Update" for
    #     self-heal-on-manual-edit. Real production incident: provider-upjet-github's
    #     RepositoryFile can get permanently stuck at Ready: Creating after any
    #     transient Create failure (confirmed live during the 2026-09-04/06 GitHub
    #     rate-limit exhaustions) - with "Update" present, the reconciler then retries
    #     a real GitHub commit every poll cycle forever, never stabilizing. This
    #     exhausted the platform's shared 5000/hr GitHub quota live on 2026-09-07/08
    #     (Backstage was initially suspected, ruled out live - the actual source was
    #     this reconcile loop). Same tradeoff already accepted for every other
    #     RepositoryFile in this catalog (loses auto-drift-correction, in exchange for
    #     not being able to loop forever).
    # 2026-09-13: bumped v0.3.59 -> v0.3.60. Fixes the SLO XR's own Ready status:
    # Sloth's PrometheusServiceLevel never sets status.conditions[type=Ready] (only
    # custom fields like promOpRulesGenerated), so function-auto-ready's "no Ready
    # condition = not ready" fallback pinned every SLO XR at Ready: False/Creating
    # forever, even once Sloth had actually finished generating the PrometheusRule -
    # confirmed live on checkout-api-liveness-latency (kiac-prod), which had been
    # stuck this way for 4+ hours despite a fully working pipeline. Sets the
    # gotemplating.fn.crossplane.io/ready annotation on the composed
    # PrometheusServiceLevel from its own observed promOpRulesGenerated status.
    # v0.3.59..v0.3.60's only xrds/compositions/ diff is this one addition (checked
    # via `git diff --stat`) - clean, additive-only, same bar the prior bumps above
    # used.
    # 2026-09-13: bumped v0.3.60 -> v0.3.62 (matches gitops-cluster-kind-prod's own
    # bump). v0.3.60's own dig-based readiness check crashes instead of degrading
    # gracefully on a genuine first reconcile - Sprig's dig only falls through to
    # its default when a key is fully ABSENT, not when an intermediate level is
    # PRESENT but nil (v0.3.61), and .observed.resources itself can be nil too, not
    # just an empty map (v0.3.62). Confirmed live on kiac-prod's checkout-api-
    # readiness-latency: 36 identical ComposeResources crashes over 16 minutes
    # before v0.3.61, then a second crash one level up until v0.3.62. Only
    # xrds/compositions/ diff across both bumps is compositions/slo/composition.yaml
    # (checked via `git diff --stat`).
    # v0.3.72: fixes a fleet-wide compose failure v0.3.71 itself introduced -
    # that fix's own explanatory comment in values-yaml.yaml wrote the literal
    # text `<<- if $clusterOk >>`, and << >> are this Composition's real
    # Go-template delimiters, so the templating engine parsed it as a real,
    # unclosed `if` action (comments are still plain text to a template
    # parser) and broke composition for every ApplicationEnvironment XR in
    # the cluster from ~2026-09-15T19:03 UTC onward (confirmed live: every
    # existing env plus 2 brand-new onboards - checkout-api/proofing,
    # order-api/pre-prod - stuck on "cannot compose resources ... unexpected
    # EOF"). v0.3.71: fixes a real prod-config-wipe bug (values-yaml.yaml's
    # Delete management policy let a transient $clusterOk gate flap
    # delete-then-recreate a live app's already-deployed
    # rollout.image/releaseTracking, confirmed on order-api 2026-09-15) plus
    # 3 already-tagged SLO namespace/naming fixes that had never been adopted
    # here (v0.3.63 was cut before any of them existed).
    # 2026-09-18: bumped from v0.3.72 to v0.3.73 - SecretStore's Composition now
    # renders github.com/jfillman/provider-infisical's real resource chain
    # (Project/ProjectEnvironment/Identity/IdentityKubernetesAuth/ProjectIdentity/
    # a synthetic identityId Secret) for kubernetes-auth clusters (kiac-dev, the
    # one that hosts Infisical directly), replacing the hand-rolled
    # infisical-secretstore-operator's InfisicalProject CR for that path.
    # Universal-auth clusters (kind-prod) are unaffected - that branch still
    # renders the old CR, deliberately, since IdentityUniversalAuthClientSecret
    # hits a real bug in terraform-provider-infisical's own Go SDK. Only
    # compositions/secretstore/composition.yaml changed in range (checked via
    # `git diff --stat v0.3.72 v0.3.73` against this Application's own
    # xrds/compositions/*/composition.yaml scope) - same bar every bump above
    # used.
    #
    # REAL CONSEQUENCE, not a routine additive bump like most bumps above:
    # every already-onboarded kiac-dev app's existing InfisicalProject CR falls
    # out of the new template's render set on its very next reconcile
    # (compositionUpdatePolicy is unset/Automatic on all of them - confirmed
    # live) - Crossplane garbage-collects it, which fires
    # infisical-secretstore-operator's own on_delete() handler
    # (unconditional, no guard: DELETE /api/v1/projects/{id}), permanently
    # deleting the real Infisical project AND every secret stored in it. New
    # Project/Identity/etc. get created fresh, empty, under new credentials.
    # Before this bump: every affected project's secrets were backed up twice
    # (local file export + live sibling "-backup" projects in Infisical
    # itself, both verified secret-count-for-secret-count against the
    # originals) - see infisical-backups/kiac-dev-full-export-20260917-184924/
    # locally. Restoring the real secret values into each newly-created
    # project from that backup is the very next step after this bump goes
    # live, not a follow-up someday.
    # 2026-09-17: bumped from v0.3.73 to v0.3.74 - fixes a self-inflicted parse
    # bug in v0.3.73 itself: infisicalproject.yaml's new explanatory comment used
    # a Go-template comment ACTION (`<<- /* ... */ >>`) with a space between `*/`
    # and the closing `>>`. Go's text/template lexer requires the right delimiter
    # to immediately follow the comment-close token with zero characters between
    # - the space broke it with "comment ends before closing delimiter",
    # confirmed live: all 7 real SecretStore XRs on kiac-dev went
    # Synced: False/ReconcileError the moment v0.3.73 synced. Root-caused by
    # extracting the rendered template and parsing it with Go's own text/template
    # package locally (reproduced the exact error at the exact line). Fixed by
    # replacing it with a plain `#`-prefixed YAML comment, matching every other
    # comment block in this Composition's templates (never parsed as a template
    # action, so this can't recur the same way). Only
    # compositions/secretstore/composition.yaml changed (checked via `git diff
    # --stat v0.3.73 v0.3.74`) - same bar every bump above used.
    #
    # Confirmed no data loss occurred during the v0.3.73 outage window: because
    # the render failed entirely, Crossplane never obtained a valid new desired
    # state to diff the old InfisicalProject CRs against, so no garbage
    # collection happened - all 7 apps' old CRs stayed Ready/untouched the whole
    # time (`kubectl get infisicalprojects.secrets.idp.io -A` confirmed all
    # PHASE: Ready, zero new provider-infisical Project resources existed). The
    # REAL CONSEQUENCE warning above still applies in full now that this bump
    # actually renders cleanly - secret backup/restore is still the very next
    # step once this reaches kiac-dev.
    # 2026-09-17: bumped from v0.3.74 to v0.3.75 - found live during the real
    # cutover itself, right after v0.3.74 unblocked all 7 XRs: the synthetic
    # identityId Secret's Object resource (provider-kubernetes) used
    # spec.forProvider.manifest.stringData, which the API server silently
    # converts to `data` server-side and never persists as `stringData` - so
    # provider-kubernetes' managedFields-based Observe (which extracts only the
    # fields it owns by walking the desired manifest's own field paths) found
    # nothing at the stringData path and errored converting a nil into a map
    # ("unable to convert managed fields ... expected map, got <nil>",
    # ReconcileError on checkout-api-kind-dev's Object the moment it reached its
    # first real Observe pass, right after its old InfisicalProject CR was
    # manually deleted to free the project slug - see below). Fixed by switching
    # to `data` with an explicit b64enc. Only
    # compositions/secretstore/composition.yaml changed (checked via `git diff
    # --stat v0.3.74 v0.3.75`) - same bar every bump above used. Caught and fixed
    # before touching the other 6 apps' old CRs, so they hit this only once
    # collectively, not once each.
    #
    # STATUS OF THE REAL CUTOVER as of this bump: Crossplane does NOT
    # auto-garbage-collect the old InfisicalProject CRs just because they fell
    # out of the Composition's render set (confirmed live: the CR's ref
    # disappeared from the XR's own spec.resourceRefs immediately, but the CR
    # itself sat untouched, Ready, for 8+ minutes across 20+ reconciles - the new
    # Project resource simply kept failing with a 400 "slug already exists"
    # since Infisical enforces unique slugs org-wide and the old project still
    # held it). The real mechanism is: manually delete each old InfisicalProject
    # CR (verified backup exists first) to free its slug, which fires the old
    # kopf operator's on_delete() and lets the new Project create cleanly on
    # retry. checkout-api-kind-dev was cut over this way as the live canary
    # before this bump (old CR deleted, new chain verified reaching Ready). The
    # other 7 apps' (7 cicd + platform-cicd) old CRs are still intact/untouched -
    # same one-at-a-time, verify-then-proceed approach continues after this
    # bump lands, restoring each app's secrets from backup immediately after its
    # own cutover.
    targetRevision: v0.3.75
    path: .
    directory:
      recurse: true
      include: "{xrds/*.yaml,compositions/*/composition.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
