# One per-app AppProject (gitops-strategy.md §6), generated from
# gitops-cluster-dev-tenants/tenants/<app>/app.yaml - deliberately the COARSER of the
# two tenant-onboarding ApplicationSets (one entry per app, not per app+env), since an
# app's AppProject is shared across every env it has on this cluster; generating it from
# the finer-grained per-env identity.yaml files instead would produce N conflicting
# ApplicationSet entries all trying to own the same AppProject name.
#
# ApplicationSet can only generate Application objects, not arbitrary resource kinds -
# there's no native "AppProjectSet" generator. The workaround here (same shape used
# elsewhere in the ArgoCD ecosystem for this exact gap): generate an Application per
# app whose only job is to render ./chart's templates, values-driven.
#
# ./chart now renders THREE objects, not one (gitops-strategy.md §10, added
# 2026-08-16): the original per-app AppProject (appproject.yaml, upper-env scoped),
# a second narrower AppProject (appproject-lower.yaml, dev-cluster-only self-service
# lower envs), and a per-app ApplicationSet (lower-envs-applicationset.yaml) whose own
# git generator watches THIS app's own src repo (appRepoUrl, not this repo) for
# platform/envs/*.yaml - the only way to fan out to N different apps' own repos, since
# a single git-files generator can only ever have one static repoURL. See that
# template's own header for why it (unlike this file) DOES need {{ }}-vs-Helm-template
# escaping - it emits ArgoCD goTemplate syntax of its OWN, one Helm-render layer
# beneath this file's plain-YAML ApplicationSet.
#
# appRepoUrl added to valuesObject below 2026-08-16 - already present in every
# tenants/<app>/app.yaml (NodeJSApplication's own Composition writes it), just
# unused by this chart until the lower-env tier needed it.
#
# No {{ }}-vs-Helm-template escaping needed in THIS file (unlike platform-cicd's
# chart-embedded tenant-onboarding-applicationset.yaml) - this repo's manifests are
# plain YAML, never passed through Helm themselves, so ArgoCD's own goTemplate syntax
# below is written directly, no double-escaping.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-appprojects
  namespace: argocd-apps
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: tenant-onboarding
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  # Temporarily true 2026-08-16 for the appproject->onboarding rename below - this is the
  # ApplicationSet's OWN meta-level syncPolicy (spec.syncPolicy), a different field from
  # spec.template.spec.syncPolicy below (which governs each GENERATED Application's own
  # sync behavior, untouched). Without this, the moment the old <app>-appproject name
  # drops out of this ApplicationSet's generated set, ArgoCD deletes that Application and
  # cascade-prunes everything it tracks - the lower AppProject AND the lower-envs
  # ApplicationSet, which itself owns live per-env Applications like <app>-dev. A real
  # risk with real tenants live on this cluster, not theoretical. Tried removing the
  # Application's own finalizer first (both by live kubectl patch and via the template
  # above) - confirmed live that ArgoCD's ApplicationSet controller re-adds
  # resources-finalizer.argocd.argoproj.io within ~1s regardless of what the template
  # says, so that field isn't the right lever; this one is. Restored to false once the
  # rename is confirmed adopted without recreation - see git history for the follow-up.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-dev-tenants.git
        revision: main
        files:
          - path: "tenants/*/app.yaml"
  template:
    metadata:
      name: "{{.appName}}-appproject"
      labels:
        platform.io/component: cluster-config
        platform.io/subcomponent: tenant-onboarding
        platform.io/app: "{{.appName}}"
      # Cascade-deletes the AppProject if a tenant's app.yaml is ever removed - same
      # finalizer/reasoning as platform-cicd's own tenant-onboarding-applicationset.yaml.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: default
      source:
        repoURL: https://github.com/jfillman/gitops-cluster-dev.git
        targetRevision: main
        path: 02-argocd-apps/tenant-appprojects/chart
        helm:
          valuesObject:
            appName: "{{.appName}}"
            gitopsRepoUrl: "{{.gitopsRepoUrl}}"
            appRepoUrl: "{{.appRepoUrl}}"
            idpServiceCatalogRepoUrl: "https://github.com/jfillman/idp-service-catalog.git"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd-apps
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
